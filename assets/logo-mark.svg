    <!-- Stylized Cloud Overlap -->
    <path d="M31 57 C31 52 35 47 41 47 C42 47 43 47.3 44 48 C46 42 51 38 58 38 C66 38 73 45 73 53 C73 54 72.8 55 72.7 55.5 C77 56.5 80 60.5 80 65 C80 71 75 76 69 76 L33 76 C26 76 20 70 20 63 C20 57 25 52 31 51" 
          fill="none" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.45"/>

    <!-- Central Security Padlock Core -->
    <rect x="42" y="55" width="16" height="13" rx="3" fill="url(#cloudShieldGradIcon)" />
    <path d="M45.5 55 V49 C45.5 46.5 47.5 44 50 44 C52.5 44 54.5 46.5 54.5 49 V55" 
          stroke="url(#cloudShieldGradIcon)" stroke-width="3" fill="none" stroke-linecap="round" />
    <circle cx="50" cy="61.5" r="2" fill="#FFFFFF" />
  </g>
</svg>
